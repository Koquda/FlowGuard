services:
  api:
    build: .
    command: [python, -m, flowguard, api]
    environment:
      HOST: 0.0.0.0
      PROCESSOR_URL: http://processor:8081
    ports: ["127.0.0.1:8080:8080"]
    volumes: ["payments:/data"]
    restart: unless-stopped
  worker:
    build: .
    command: [python, -m, flowguard, worker]
    environment:
      PROCESSOR_URL: http://processor:8081
    volumes: ["payments:/data"]
    restart: unless-stopped
  processor:
    build: .
    command: [python, -m, flowguard, processor]
    environment:
      HOST: 0.0.0.0
    volumes: ["processor:/data"]
    restart: unless-stopped
  prometheus:
    image: prom/prometheus:v3.5.0
    profiles: [monitoring]
    ports: ["127.0.0.1:9090:9090"]
    volumes:
      - ./infra/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/alerts.yml:/etc/prometheus/alerts.yml:ro
volumes:
  payments:
  processor:
